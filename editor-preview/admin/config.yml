backend:
  name: github
  repo: rjbryantresreyes-cpu/cherry-sage-website3
  branch: main

site_url: https://cherrysage.com
display_url: https://cherrysage.com
logo_url: https://cherrysage.com/assets/logo-horizontal.png

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "articles"
    label: "Guest Articles"
    label_singular: "Guest Article"
    description: "Add a new guest article, or edit one you already published. Fill in the fields and click Publish — it builds the page and adds it to the Guest Articles list automatically, live on the site in about a minute."
    folder: "content/articles"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{category}}"
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "The article's headline." }
      - { label: "Category", name: "category", widget: "select", hint: "Pick the topic this article belongs to — these are the exact topics shown on the Guest Articles page.", options: ["Abundance", "Astrology", "Business & Spirituality", "Dreams", "Feng Shui", "Herbal Remedies", "Inspiration & Self-Mastery", "Karma", "Meditation", "Metaphysics", "Natural Medicine", "New Age", "Numerology", "Psychic & Paranormal", "Psychic Medium", "Psychic Readings", "Reincarnation", "Tarot", "Wisdom", "Yoga"] }
      - { label: "Author (optional)", name: "author", widget: "string", required: false, hint: "The guest author's name, if there is one." }
      - { label: "Featured image", name: "image", widget: "image", hint: "This shows on the article card and at the top of the article." }
      - { label: "Article", name: "body", widget: "markdown", hint: "The full article text. Use the toolbar for bold, headings, links." }
